<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random sõnad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Random sõnad</h1>
<p class="subtitle">Harjuta eesti ja vene keele sõnavara</p>

<table>
    <tr>
        <th>Eesti → Vene</th>
        <th>Vene → Eesti</th>
    </tr>

    <tr>
        <td>
            <p class="word" id="questionEt"></p>
            <input type="text" id="answerRu" placeholder="Sisesta vene tõlge">
            <br>
            <button id="checkRuButton">Kontrolli</button>
            <p class="result" id="resultRu"></p>
        </td>

        <td>
            <p class="word" id="questionRu"></p>
            <input type="text" id="answerEt" placeholder="Sisesta eesti tõlge">
            <br>
            <button id="checkEtButton">Kontrolli</button>
            <p class="result" id="resultEt"></p>
        </td>
    </tr>
</table>

<button id="refreshButton" onclick="location.reload()">Uus sõna</button>

<!-- Sõna valimise ala -->
<div class="word-selection">
    <h2>Vali sõna</h2>

    <select id="wordSelect">
        <option value="">-- Vali sõna --</option>
        <option value="kass">kass</option>
        <option value="koer">koer</option>
        <option value="maja">maja</option>
        <option value="auto">auto</option>
    </select>

    <div id="translationArea" style="display: none;">
        <p class="word" id="selectedWord"></p>

        <input type="text" id="translationInput" placeholder="Sisesta tõlge">

        <br>

        <button id="checkTranslationButton">Kontrolli</button>

        <p class="result" id="translationResult"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>g
