<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random sõnad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Random sõnad</h1>

<table>
    <tr>
        <th>Eesti → Vene</th>
        <th>Vene → Eesti</th>
    </tr>

    <tr>
        <td>
            <p id="questionEt"></p>
            <input type="text" id="answerRu" placeholder="Sisesta vene tõlge">
            <button id="checkRuButton">Kontrolli</button>
            <p id="resultRu"></p>
        </td>

        <td>
            <p id="questionRu"></p>
            <input type="text" id="answerEt" placeholder="Sisesta eesti tõlge">
            <button id="checkEtButton">Kontrolli</button>
            <p id="resultEt"></p>
        </td>
    </tr>
</table>

<script src="script.js"></script>
</body>
</html>
